services:
  # Vector store for the RAG phase (chunks + bill_pay + embeddings). REQUIRED.
  # Matches DATABASE_URL=postgresql://rag:rag@localhost:5436/rag in .env.
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag-postgres
    ports:
      - "5436:5432"
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    volumes:
      - rag_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 10s
      timeout: 5s
      retries: 12

  # LEGACY / OPTIONAL: docling now runs in-process via the `docling` package, so
  # this service is no longer used by the pipeline. Kept for reference; start it
  # only if you want the standalone docling-serve UI.
  docling-serve:
    image: quay.io/docling-project/docling-serve-cpu:latest
    container_name: rate-filing-docling
    profiles: ["legacy"]
    ports:
      - "5001:5001"
    environment:
      DOCLING_SERVE_ENABLE_UI: "true"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5001/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  rag_pgdata:
