services:
  docling-serve:
    image: quay.io/docling-project/docling-serve-cpu:latest
    container_name: rate-filing-docling
    ports:
      - "5001:5001"
    environment:
      DOCLING_SERVE_ENABLE_UI: "true"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5001/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
