[project]
name = "rate-filing"
version = "0.1.0"
description = "Carrier-agnostic insurance rate-filing PDF -> bill-pay data + RAG (Postgres/pgvector)"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.40",
    "openpyxl>=3.1",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pypdf>=4.2",
    "pdfplumber>=0.11",
    "docling>=2.100.0",
    # OCR engine is platform-dependent: Apple Vision on macOS (no model download),
    # EasyOCR elsewhere (Windows/Linux, GPU-capable). DOCLING_OCR_ENGINE=auto picks
    # the right one at runtime; these markers make `uv sync` install the right pkg.
    "ocrmac>=1.0.1; sys_platform == 'darwin'",
    "easyocr>=1.7; sys_platform != 'darwin'",
    "psycopg[binary]>=3.3.4",
    "pgvector>=0.4.2",
    "fastapi>=0.136.3",
    "uvicorn[standard]>=0.49.0",
    "python-dateutil>=2.9.0.post0",
]

[project.optional-dependencies]
airflow = ["apache-airflow>=3.0", "apache-airflow-providers-standard>=0.1"]

[project.scripts]
rate-filing = "rate_filing.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rate_filing"]

[dependency-groups]
dev = ["pytest>=8.0"]
